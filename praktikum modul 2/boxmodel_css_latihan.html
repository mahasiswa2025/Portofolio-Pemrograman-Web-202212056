<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum CSS - Latihan 6</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #334155;
    }

    h1 {
      color: #1e293b;
      margin-bottom: 5px;
      font-size: 1.75rem;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    /* Kotak Latihan Box Model */
    .box-model-demo {
      margin: 30px; /* Margin 30px sesuai instruksi */
      padding: 15px; /* Padding 15px sesuai instruksi */
      border: 5px solid #ef4444; /* Border merah tebal sesuai instruksi */
      width: 300px; /* Lebar kotak 300px sesuai instruksi */
      
      background-color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .box-model-demo p {
      margin: 0;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .label {
      font-weight: bold;
      color: #ef4444;
      margin-bottom: 8px;
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .specs {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
      font-size: 0.8rem;
      color: #64748b;
    }

    .specs ul {
      margin: 5px 0 0 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <h1>Visualisasi Box Model</h1>
  <div class="subtitle">Praktikum: Yudha Achmad Muddatzir (202212056)</div>

  <!-- Kotak Demo Box Model -->
  <div class="box-model-demo">
    <span class="label">Kotak Box Model</span>
    <p>
      Halo! Saya adalah elemen kotak yang dikonfigurasi untuk mendemonstrasikan konsep Box Model CSS.
    </p>
    <div class="specs">
      <strong>Spesifikasi Kotak:</strong>
      <ul>
        <li>Lebar (Width): 300px</li>
        <li>Margin: 30px</li>
        <li>Padding: 15px</li>
        <li>Border: 5px Solid Merah (Tebal)</li>
      </ul>
    </div>
  </div>
</body>
</html>
