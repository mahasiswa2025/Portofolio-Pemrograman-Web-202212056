<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum CSS - Latihan 7</title>
  <style>
    body {
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }

    h1 {
      color: #0f172a;
      margin-bottom: 5px;
      font-size: 1.75rem;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    /* Container Flexbox */
    .flex-container {
      display: flex;
      justify-content: space-evenly; /* Tersebar merata sesuai instruksi */
      align-items: center;          /* Sejajar di tengah secara vertikal sesuai instruksi */
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 30px;
      max-width: 800px;
      width: 100%;
      min-height: 250px; /* Memberikan ruang tinggi untuk melihat alignment vertikal */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.02), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      box-sizing: border-box;
    }

    /* Item di dalam Flexbox */
    .flex-item {
      background: linear-gradient(135deg, #6366f1, #4f46e5); /* Gradien indigo premium */
      color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      width: 150px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    /* Efek hover */
    .flex-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 20px 0 rgba(99, 102, 241, 0.45);
    }

    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>Layout Fleksibel (Flexbox)</h1>
  <div class="subtitle">Praktikum: Yudha Achmad Muddatzir (202212056)</div>

  <!-- Container Flexbox -->
  <div class="flex-container">
    <div class="flex-item">Kartu 1</div>
    <div class="flex-item">Kartu 2</div>
    <div class="flex-item">Kartu 3</div>
  </div>

  <div class="footer">
    Teknik Informatika - STITEK Bontang
  </div>
</body>
</html>
