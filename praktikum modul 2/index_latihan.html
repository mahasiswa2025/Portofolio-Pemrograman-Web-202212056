<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum CSS - Latihan 1</title>
  <style>
    body {
      background-color: #fffbeb; /* Kuning muda (amber-50) */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #334155;
    }
    .card {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.1), 0 8px 10px -6px rgba(217, 119, 6, 0.1);
      border: 1px solid #fef3c7;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      color: #dc2626; /* Judul berwarna merah (red-600) */
      font-size: 2.25rem;
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    p {
      color: #4b5563;
      font-size: 1.125rem;
      line-height: 1.75;
      margin: 0;
    }
    .info {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Selamat Datang di Praktikum CSS</h1>
    <p>Ini adalah halaman HTML sederhana dengan latar belakang kuning muda, judul berwarna merah, dan semua teks rata tengah sesuai dengan instruksi Latihan 1.</p>
    <div class="info">
      <p style="font-size: 0.875rem; color: #9ca3af; margin-bottom: 4px;">Praktikan: Yudha Achmad Muddatzir (202212056)</p>
      <p style="font-size: 0.875rem; color: #9ca3af;">Teknik Informatika - STITEK Bontang</p>
    </div>
  </div>
</body>
</html>
