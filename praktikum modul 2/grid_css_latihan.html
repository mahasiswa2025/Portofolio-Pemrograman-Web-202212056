<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum CSS - Latihan 8</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #0f172a;
    }

    h1 {
      color: #0f172a;
      margin-bottom: 5px;
      font-size: 1.75rem;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    /* Container Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 kolom sesuai instruksi */
      grid-template-rows: repeat(2, 120px);  /* 2 baris dengan tinggi masing-masing 120px */
      gap: 15px;                             /* Jarak antar grid item 15px sesuai instruksi */
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    /* Gaya dasar untuk item grid */
    .grid-item {
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.25rem;
      border-radius: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .grid-item:hover {
      transform: scale(1.03);
    }

    /* 6 Grid Item dengan Warna Latar Berbeda sesuai instruksi */
    .item-1 {
      background-color: #6366f1; /* Indigo */
      /* Mengatur grid item pertama agar menempati 2 kolom sekaligus */
      grid-column: span 2; /* Menempati 2 kolom */
    }

    .item-2 {
      background-color: #ef4444; /* Merah */
    }

    .item-3 {
      background-color: #10b981; /* Hijau */
    }

    .item-4 {
      background-color: #f59e0b; /* Amber */
    }

    .item-5 {
      background-color: #ec4899; /* Pink */
    }

    .item-6 {
      background-color: #06b6d4; /* Cyan */
    }

    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>Tata Letak Dua Dimensi (CSS Grid)</h1>
  <div class="subtitle">Praktikum: Yudha Achmad Muddatzir (202212056)</div>

  <!-- Container Grid -->
  <div class="grid-container">
    <!-- Grid Item 1 diset span 2 kolom -->
    <div class="grid-item item-1">Item 1 (Spans 2 Cols)</div>
    <div class="grid-item item-2">Item 2</div>
    <div class="grid-item item-3">Item 3</div>
    <div class="grid-item item-4">Item 4</div>
    <div class="grid-item item-5">Item 5</div>
    <div class="grid-item item-6">Item 6</div>
  </div>

  <div class="footer">
    Teknik Informatika - STITEK Bontang
  </div>
</body>
</html>
