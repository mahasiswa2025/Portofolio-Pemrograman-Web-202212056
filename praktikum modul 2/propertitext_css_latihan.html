<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum CSS - Latihan 5</title>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1f2937;
    }

    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      max-width: 600px;
      width: 100%;
      border: 1px solid #e5e7eb;
    }

    /* Judul dengan font berbeda dan ukuran besar */
    h1 {
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      font-size: 48px; /* Ukuran besar sesuai instruksi */
      font-weight: 700;
      color: #111827;
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
      line-height: 1.2;
    }

    /* Paragraf dengan teks rata kanan dan garis bawah */
    p.latihan-teks {
      text-align: right; /* Rata kanan sesuai instruksi */
      text-decoration: underline; /* Garis bawah sesuai instruksi */
      text-decoration-color: #3b82f6; /* Warna garis bawah agar estetik */
      text-decoration-thickness: 2px;
      font-size: 1.15rem;
      line-height: 1.8;
      color: #374151;
      margin-bottom: 20px;
    }

    .footer {
      border-top: 1px dashed #e5e7eb;
      margin-top: 30px;
      padding-top: 20px;
      text-align: right;
      font-size: 0.85rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bismillah</h1>
    
    <p class="latihan-teks">
      Ini adalah paragraf latihan yang diatur dengan perataan rata kanan.
    </p>

    <p class="latihan-teks">
      Sesuai dengan panduan Latihan 5, teks ini juga memiliki dekorasi garis bawah (underline).
    </p>
    
    <div class="footer">
      Praktikum: Yudha Achmad Muddatzir (202212056)
    </div>
  </div>
</body>
</html>
