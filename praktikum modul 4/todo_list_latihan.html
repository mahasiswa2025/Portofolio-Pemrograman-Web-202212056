<!DOCTYPE html>
<html>
<head>
  <title>Aplikasi To-Do List - Latihan</title>
  <style>
    body { font-family: sans-serif; margin: 30px; }
    .todo-box { background: #fafafa; border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 450px; }
    input[type="text"] { padding: 8px; width: 70%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn-add { padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-add:hover { background: #218838; }
    ul { padding-left: 0; list-style: none; margin-top: 15px; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: white; border: 1px solid #eee; margin-bottom: 5px; border-radius: 4px; }
    .btn-delete { padding: 4px 8px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .btn-delete:hover { background: #c82333; }
  </style>
</head>
<body>
  <div class="todo-box">
    <h2>To-Do List Sederhana</h2>
    <input type="text" id="input-todo" placeholder="Ketik tugas baru...">
    <button class="btn-add" onclick="tambahTugas()">Tambah</button>
    <ul id="daftar-tugas"></ul>
  </div>
  
  <script>
    var tugas = [];
    
    function tambahTugas() {
      var inputElement = document.getElementById("input-todo");
      var text = inputElement.value.trim();
      if (text === "") {
        alert("Ketikkan sesuatu terlebih dahulu!");
        return;
      }
      tugas.push(text);
      inputElement.value = "";
      tampilkanDaftar();
    }
    
    // Modifikasi: Menambahkan tombol "Hapus" di sebelah setiap item daftar yang bisa menghapus item tersebut dari array dan tampilan
    function tampilkanDaftar() {
      var daftarElement = document.getElementById("daftar-tugas");
      daftarElement.innerHTML = "";
      for (let i = 0; i < tugas.length; i++) {
        daftarElement.innerHTML += "<li>" + 
          "<span>" + tugas[i] + "</span>" +
          "<button class='btn-delete' onclick='hapusTugas(" + i + ")'>Hapus</button>" + 
          "</li>";
      }
    }
    
    // Fungsi Hapus Tugas kustom menggunakan array.splice(index, 1) sesuai petunjuk
    function hapusTugas(index) {
      tugas.splice(index, 1);
      tampilkanDaftar();
    }
  </script>
</body>
</html>
