<html>
<head>
  <title>Kalkulator - Latihan</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eef2f3; margin: 0; }
    .calculator { width: 260px; background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    #display { width: 100%; height: 50px; text-align: right; font-size: 1.5em; margin-bottom: 15px; padding: 10px; border-radius: 6px; border: 1px solid #ddd; background: #fafafa; color: #333; box-sizing: border-box; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .buttons button { width: 100%; height: 50px; border-radius: 6px; border: none; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .buttons button:active { transform: scale(0.95); }
    .btn-num { background: #f0f0f0; color: #333; }
    .btn-num:hover { background: #e4e4e4; }
    .btn-op { background: #fe9505; color: white; }
    .btn-op:hover { background: #e08404; }
    .btn-clear { background: #ff3b30; color: white; }
    .btn-clear:hover { background: #e02e24; }
    .btn-equal { background: #34c759; color: white; }
    .btn-equal:hover { background: #28a745; }
  </style>
</head>
<body>
  <div class="calculator">
    <h4 style="text-align: center; margin-top: 0; color: #666; font-size: 0.9em;">Yudha's Calculator</h4>
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button class="btn-num" onclick="appendValue('7')">7</button>
      <button class="btn-num" onclick="appendValue('8')">8</button>
      <button class="btn-num" onclick="appendValue('9')">9</button>
      <button class="btn-op" onclick="appendValue('/')">/</button>
      
      <button class="btn-num" onclick="appendValue('4')">4</button>
      <button class="btn-num" onclick="appendValue('5')">5</button>
      <button class="btn-num" onclick="appendValue('6')">6</button>
      <button class="btn-op" onclick="appendValue('*')">*</button>
      
      <button class="btn-num" onclick="appendValue('1')">1</button>
      <button class="btn-num" onclick="appendValue('2')">2</button>
      <button class="btn-num" onclick="appendValue('3')">3</button>
      <button class="btn-op" onclick="appendValue('-')">-</button>
      
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn-num" onclick="appendValue('0')">0</button>
      <button class="btn-equal" onclick="calculate()">=</button>
      <button class="btn-op" onclick="appendValue('+')">+</button>
    </div>
  </div>
  
  <script>
    var display = document.getElementById('display');
    function appendValue(value) { display.value += value; }
    function clearDisplay() { display.value = ''; }
    function calculate() {
      try {
        // eval() digunakan untuk mengevaluasi ekspresi matematika bertipe string yang ada pada display.
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
