<!DOCTYPE html>
<html>
<head>
  <title>Latihan Perulangan - Latihan</title>
  <style>
    body { font-family: sans-serif; margin: 30px; }
    .box { background: #fafafa; border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 400px; }
    ul { padding-left: 20px; }
    li { padding: 5px 0; font-size: 1.1em; color: #333; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Daftar Teman Sekelas</h2>
    <p class="text-muted">Menampilkan daftar teman menggunakan perulangan <code>for</code> pada JavaScript:</p>
    <ul id="daftar-teman">
      <!-- Konten akan diisi oleh JavaScript -->
    </ul>
  </div>
  
  <script>
    // Modifikasi: Mengganti isi array dengan daftar nama teman sekelas (minimal 5 nama)
    var teman = [
      "Alvin Pradana", 
      "Kholis Maulana", 
      "Jamil Nur", 
      "Feby Imaniar", 
      "Bahlil",
      "Yudha Achmad"
    ];
    var daftarElement = document.getElementById("daftar-teman");
    for (let i = 0; i < teman.length; i++) {
      daftarElement.innerHTML += "<li>" + teman[i] + "</li>";
    }
  </script>
</body>
</html>
