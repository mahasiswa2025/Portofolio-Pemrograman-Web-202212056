<html lang="en">
<head>
  <title>Latihan Button Styles - Latihan</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-4">
  <h2>Latihan Berbagai Gaya Tombol (Button Styles)</h2>
  <p class="text-muted">Mencoba variasi tombol Bootstrap: Solid, Outline, Ukuran, Block, dan Hover State.</p>
  
  <hr>

  <!-- Button solid dan outline -->
  <div class="mb-4">
    <h4>1. Solid vs Outline Buttons</h4>
    <div class="d-flex flex-wrap gap-2 mt-2">
      <button type="button" class="btn btn-primary">Primary</button>
      <button type="button" class="btn btn-outline-primary">Primary Outline</button>
      
      <button type="button" class="btn btn-success">Success</button>
      <button type="button" class="btn btn-outline-success">Success Outline</button>
      
      <button type="button" class="btn btn-warning">Warning</button>
      <button type="button" class="btn btn-outline-warning text-dark">Warning Outline</button>
      
      <button type="button" class="btn btn-danger">Danger</button>
      <button type="button" class="btn btn-outline-danger">Danger Outline</button>
    </div>
  </div>

  <hr>

  <!-- Button sizes -->
  <div class="mb-4">
    <h4>2. Button Sizes</h4>
    <div class="d-flex align-items-center gap-2 mt-2">
      <button type="button" class="btn btn-primary btn-lg">Large Button</button>
      <button type="button" class="btn btn-primary">Normal Button</button>
      <button type="button" class="btn btn-primary btn-sm">Small Button</button>
    </div>
  </div>

  <hr>

  <!-- Button state and Block -->
  <div class="mb-4">
    <h4>3. Disabled & Active State & Full-Width Button</h4>
    <div class="d-flex gap-2 mb-3">
      <button type="button" class="btn btn-primary active">Active Button</button>
      <button type="button" class="btn btn-primary" disabled>Disabled Button</button>
    </div>
    
    <div class="d-grid gap-2">
      <button type="button" class="btn btn-dark btn-lg">Tombol Lebar Penuh (Block Button)</button>
    </div>
  </div>
</div>
</body>
</html>
